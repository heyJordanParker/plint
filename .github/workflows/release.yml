name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release

env:
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find what this version still needs
        id: version
        run: |
          version=$(node -p "require('./.claude-plugin/plugin.json').version")
          own=$(node -p "require('./cli/package.json').version")
          [ "$own" = "$version" ] || { echo "cli/package.json is $own but .claude-plugin/plugin.json is $version"; exit 1; }
          if npm view "@cmodjs/rulebook@$version" version > /dev/null 2>&1; then echo "npm=done" >> "$GITHUB_OUTPUT"; fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then echo "release=done" >> "$GITHUB_OUTPUT"; fi
          git fetch --quiet origin main
          if ! git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- .github/workflows; then
            echo "::notice::main's .github/workflows changed since $GITHUB_SHA, and GitHub refuses this run's token a tag whose workflows differ from main's, so the run for main releases"
            echo "later=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install Claude Code and cmod, which check and publish the mod
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s latest
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          npm install -g @cmodjs/cli

      - name: Check the mod and test rulebook
        run: |
          bun install --frozen-lockfile
          bun install --cwd cli --frozen-lockfile
          cmod check .

      - name: Release the mod and the rulebook programs on GitHub
        if: steps.version.outputs.release != 'done' && steps.version.outputs.later != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cmod publish

      - name: Publish @cmodjs/rulebook to npm
        if: steps.version.outputs.npm != 'done' && steps.version.outputs.later != 'true'
        working-directory: cli
        run: npm publish --provenance
